<html lang="en" dir="ltr" data-theme="light" data-palette="navy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TurLux · The Ultimate Gift of Türkiye</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#fcf9f5; --surface:#ffffff; --ink:#4a141c; --ink-soft:rgba(74,20,28,.68); --gold:#c29b62; --gold-dark:#a8834f;
  --gold-text:#8a6a3a; --wine:#6e2633; --line:#e6d3ba; --muted:#5e6352; --hero:#4a141c; --hero-text:#e6d3ba; --on-gold:#2a0b10;
  --brand:#4a141c; --brand-hover:#6e2633; --tag:#6e2633; --loc-text:#4a141c; --gold-btn:#b08850; --gold-btn-hover:#987240;
  --hero-img-opacity:.35; --hero-blend:overlay; --scrim:none;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-palette="burgundy"]{
  --bg:#fdfbf8; --ink:#2b1d1a; --ink-soft:rgba(43,29,26,.7); --muted:#7a6a5c; --line:#eadfce;
  --gold:#c29b62; --gold-dark:#b08a52; --gold-text:#8a6a3a; --hero:#2a0b10;
  --brand:#5a1a24; --brand-hover:#74283a; --tag:#5a1a24; --loc-text:#2b1d1a;
  --hero-img-opacity:1; --hero-blend:normal;
  --scrim:linear-gradient(180deg,rgba(30,8,12,.55) 0%,rgba(30,8,12,.35) 45%,rgba(30,8,12,.7) 100%);
}
:root[data-palette="navy"]{
  --bg:#faf7f1; --ink:#1b1b1b; --ink-soft:rgba(27,27,27,.68); --muted:#5c5348; --line:#e3d8c6;
  --gold:#c9a46a; --gold-dark:#b8935a; --gold-text:#7a5a2b; --hero:#0e1a2b; --hero-text:#e6dccb; --on-gold:#0e1a2b;
  --brand:#0e1a2b; --brand-hover:#1b2a40; --tag:#0e1a2b; --loc-text:#0e1a2b; --gold-btn:#ad8a52; --gold-btn-hover:#94733f;
  --hero-img-opacity:1; --hero-blend:normal;
  --scrim:linear-gradient(180deg,rgba(14,26,43,.6) 0%,rgba(14,26,43,.35) 45%,rgba(14,26,43,.75) 100%);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#160a0d; --surface:#21121a; --ink:#f3e6d8; --ink-soft:rgba(243,230,216,.72); --gold:#c9a46a; --gold-dark:#d8b67f;
    --gold-text:#d8b67f; --wine:#8a3443; --line:#4a2a30; --muted:#c8bfae; --hero:#2a0b10; --hero-text:#e6d3ba; --on-gold:#2a0b10;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#160a0d; --surface:#21121a; --ink:#f3e6d8; --ink-soft:rgba(243,230,216,.72); --gold:#c9a46a; --gold-dark:#d8b67f;
  --gold-text:#d8b67f; --wine:#8a3443; --line:#4a2a30; --muted:#c8bfae; --hero:#2a0b10; --hero-text:#e6d3ba; --on-gold:#2a0b10;
  color-scheme: dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
[dir="rtl"] body, html[dir="rtl"] body{font-family:"Noto Naskh Arabic",Inter,Tahoma,sans-serif}
.serif{font-family:"Playfair Display",Georgia,serif}
html[dir="rtl"] .serif{font-family:"Noto Naskh Arabic","Playfair Display",Georgia,serif}
img{max-width:100%}
button{font:inherit;cursor:pointer}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
.icon{width:1em;height:1em;flex:none}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.hbar{height:80px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-size:30px;font-weight:700;color:var(--ink);text-decoration:none}
.brand span{color:var(--gold)}
.hleft{display:flex;align-items:center;gap:32px}
nav{display:flex;gap:24px}
nav a{font-size:14px;font-weight:500;color:var(--ink);text-decoration:none}
nav a.soft{color:var(--ink-soft)}
nav a:hover{color:var(--gold-text)}
.hright{display:flex;align-items:center;gap:18px}
.search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:8px 16px}
.search input{background:transparent;border:0;outline:0;font:inherit;font-size:14px;width:170px;color:var(--ink)}
.search input::placeholder{color:var(--ink-soft)}
.lang{display:flex;align-items:center;gap:6px;background:none;border:0;color:var(--ink);font-weight:600;font-size:14px;min-height:44px;padding:0 4px}
.lang:hover{color:var(--gold-text)}
.cart{display:flex;align-items:center;gap:8px;background:var(--brand);color:#fff;border:0;border-radius:4px;padding:0 16px;min-height:44px}
.cart:hover{background:var(--brand-hover)}
.badge{background:var(--gold);color:var(--on-gold);font-size:12px;font-weight:700;padding:1px 7px;border-radius:999px}

.hero{position:relative;overflow:hidden;background:var(--hero);padding:96px 0 128px}
.hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 55%;opacity:var(--hero-img-opacity);mix-blend-mode:var(--hero-blend)}
.hero .scrim{position:absolute;inset:0;background:var(--scrim);pointer-events:none}
.hero .inner{position:relative;z-index:1;text-align:center;display:flex;flex-direction:column;align-items:center}
.hero h1{margin:0 0 16px;color:#fff;font-size:clamp(36px,6vw,64px);font-weight:700;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.hero p{margin:0 auto 32px;max-width:680px;color:var(--hero-text);font-size:clamp(17px,2vw,20px);font-weight:300;line-height:1.55}
.ctas{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.btn-gold{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--gold-btn);color:#fff;border:0;border-radius:4px;font-weight:700;font-size:18px;padding:14px 32px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.btn-gold:hover{background:var(--gold-btn-hover)}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;background:transparent;color:var(--hero-text);border:1px solid var(--hero-text);border-radius:4px;font-weight:600;font-size:18px;padding:13px 32px}
.btn-ghost:hover{background:var(--hero-text);color:var(--brand)}

.features{position:relative;z-index:2;max-width:1280px;margin:-24px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.05);padding:24px 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.feat{display:flex;align-items:center;gap:16px;padding:8px 24px}
.feat + .feat{border-inline-start:1px solid var(--line)}
.feat .ic{background:var(--bg);color:var(--gold-text);border-radius:999px;padding:12px;display:flex;font-size:24px}
.feat h4{margin:0;font-size:16px;font-weight:600}
.feat p{margin:2px 0 0;font-size:14px;color:var(--ink-soft)}

main{padding:48px 0 96px}
.filters{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);z-index:40;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:16px 0;margin-bottom:32px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:0 20px;min-height:40px;border-radius:999px;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.chip:hover{border-color:var(--gold)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .3s}
.card:hover{box-shadow:0 20px 40px rgba(74,20,28,.14)}
.media{position:relative;height:360px;overflow:hidden;background:var(--line)}
.media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s}
.card:hover .media img{transform:scale(1.05)}
.tags{position:absolute;top:12px;inset-inline-end:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
html[dir="rtl"] .tags{align-items:flex-start}
.loc{background:rgba(255,255,255,.92);color:var(--loc-text);font-size:12px;font-weight:700;padding:4px 10px;border-radius:4px;display:flex;align-items:center;gap:4px}
.loc .icon{color:#a8834f}
.tag{background:var(--tag);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:4px}
.body{padding:28px;display:flex;flex-direction:column;flex-grow:1}
.trow{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:8px}
.trow h3{margin:0;font-size:26px;font-weight:700;line-height:1.25}
.price{color:var(--gold-text);font-weight:700;font-size:20px;white-space:nowrap}
.cats{margin:0 0 24px;font-size:14px;color:var(--muted)}
.actions{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.add{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--gold-btn);color:#fff;border:0;border-radius:4px;font-weight:700;font-size:18px;min-height:56px}
.add:hover{background:var(--gold-btn-hover)}
.add[data-added="true"]{background:var(--brand);color:#fff}
.quick{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:4px;font-weight:500;font-size:14px;min-height:44px}
.quick:hover{background:var(--bg)}
.empty{grid-column:1/-1;text-align:center;color:var(--ink-soft);padding:48px 0}

.fab{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));inset-inline-end:24px;z-index:50}
.fab button{width:56px;height:56px;border-radius:999px;border:0;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 40px rgba(0,0,0,.3);font-size:24px;position:relative}
.fab button:hover{background:var(--brand-hover)}
.fab .tip{position:absolute;inset-inline-end:calc(100% + 14px);top:50%;transform:translateY(-50%);background:var(--surface);color:var(--ink);border:1px solid var(--line);font-size:14px;font-weight:600;padding:6px 12px;border-radius:4px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 8px 20px rgba(0,0,0,.15)}
.fab button:hover .tip,.fab button:focus-visible .tip{opacity:1}

.palette{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));inset-inline-start:24px;z-index:55;background:var(--surface);border:1px solid var(--line);border-radius:999px;box-shadow:0 12px 30px rgba(0,0,0,.18);padding:6px;display:flex;align-items:center;gap:4px;font-size:13px;max-width:calc(100vw - 120px);overflow-x:auto}
.palette .pl{padding:0 10px 0 12px;font-weight:600;color:var(--ink-soft);white-space:nowrap}
.palette button{border:0;background:transparent;color:var(--ink);border-radius:999px;min-height:40px;padding:0 14px;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap}
.palette button[aria-pressed="true"]{background:var(--brand);color:#fff}
.palette .sw{display:inline-flex}
.palette .sw i{width:12px;height:12px;border-radius:999px;display:block;border:1px solid rgba(255,255,255,.6)}
.palette .sw i + i{margin-inline-start:-4px}
@media (max-width:1023px){ .media{height:300px} }
@media (max-width:767px){
  nav,.search{display:none}
  .features{grid-template-columns:1fr;margin:-24px 16px 0}
  .feat + .feat{border-inline-start:0;border-top:1px solid var(--line);padding-top:16px}
  .grid{grid-template-columns:1fr}
  .cart .lbl{display:none}
  .hero{padding:64px 0 88px}
  .ctas{flex-direction:column;width:100%}
}
</style>
</head>

var state = {lang:"en", filter:0, q:"", bag:{}};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function get(o,p){return p.split(".").reduce(function(a,k){return a&&a[k];},o);}
function withFallback(img){
  var fb = img.getAttribute("data-fallback");
  function swap(){ if(img.src!==fb){ img.src = fb; } }
  img.addEventListener("error", swap, {once:true});
  img.src = img.getAttribute("data-photo");
  if(img.complete && img.naturalWidth===0){ swap(); }
}
function render(){
  var t = content[state.lang], rtl = state.lang==="ar";
  document.documentElement.lang = state.lang;
  document.documentElement.dir = rtl ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(function(el){ el.textContent = get(t, el.getAttribute("data-t")); });
  document.getElementById("langLbl").textContent = rtl ? "EN" : "عربي";
  document.getElementById("lang").setAttribute("aria-label", rtl ? "Switch to English" : "التبديل إلى العربية");
  var q = document.getElementById("q"); q.placeholder = t.ui.search;
  document.getElementById("fabBtn").setAttribute("aria-label", t.ui.concierge);
  document.getElementById("features").innerHTML = t.features.map(function(f){
    return '<div class="feat"><div class="ic">'+ICONS[f.icon]+'</div><div><h4>'+esc(f.title)+'</h4><p>'+esc(f.desc)+'</p></div></div>';
  }).join("");
  document.getElementById("chips").innerHTML = t.filters.map(function(f,i){
    return '<button type="button" class="chip" data-i="'+i+'" aria-pressed="'+(state.filter===i)+'">'+esc(f)+'</button>';
  }).join("");
  var needle = state.q.trim().toLowerCase();
  var list = t.products.filter(function(p){
    var okF = state.filter===0 || p.category.indexOf(t.filters[state.filter])>-1;
    var okQ = !needle || (p.title+" "+p.location).toLowerCase().indexOf(needle)>-1;
    return okF && okQ;
  });
  var grid = document.getElementById("grid");
  grid.innerHTML = list.length ? list.map(function(p){
    var added = !!state.bag[p.id];
    return '<article class="card">'+
      '<div class="media"><img alt="'+esc(p.title)+'" data-photo="'+IMGS[p.id]+'" data-fallback="'+FB["p"+p.id]+'">'+
      '<div class="tags"><span class="loc">'+ICONS.pin+esc(p.location)+'</span>'+(p.tag?'<span class="tag">'+esc(p.tag)+'</span>':'')+'</div></div>'+
      '<div class="body"><div class="trow"><h3 class="serif">'+esc(p.title)+'</h3><span class="price">'+esc(p.price)+'</span></div>'+
      '<p class="cats">'+esc(p.category.join(" • "))+'</p>'+
      '<div class="actions"><button type="button" class="add" data-id="'+p.id+'" data-added="'+added+'">'+(added?ICONS.check:ICONS.plus)+'<span>'+esc(added?t.ui.added:t.ui.addToBox)+'</span></button>'+
      '<button type="button" class="quick">'+esc(t.ui.viewDetails)+'</button></div></div></article>';
  }).join("") : '<p class="empty">'+esc(t.ui.empty)+'</p>';
  grid.querySelectorAll("img[data-photo]").forEach(withFallback);
  document.getElementById("count").textContent = Object.keys(state.bag).length;
  document.getElementById("cartBtn").setAttribute("aria-label", t.ui.cart+", "+Object.keys(state.bag).length);
}
document.getElementById("lang").addEventListener("click", function(){ state.lang = state.lang==="en"?"ar":"en"; state.filter=0; render(); });
document.getElementById("chips").addEventListener("click", function(e){ var b=e.target.closest(".chip"); if(!b) return; state.filter=+b.getAttribute("data-i"); render(); });
document.getElementById("grid").addEventListener("click", function(e){ var b=e.target.closest(".add"); if(!b) return; var id=b.getAttribute("data-id"); if(state.bag[id]) delete state.bag[id]; else state.bag[id]=true; render(); });
document.getElementById("q").addEventListener("input", function(e){ state.q=e.target.value; render(); document.getElementById("q").focus(); });
document.documentElement.setAttribute("data-palette", "navy");
withFallback(document.querySelector(".hero img.bg"));
render();
</script>
